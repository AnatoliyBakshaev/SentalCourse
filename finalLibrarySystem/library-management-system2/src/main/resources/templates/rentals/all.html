<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Все аренды</title>
</head>
<body>
<h1>Все аренды</h1>

<div th:if="${#lists.isEmpty(rentals)}">
    <p>Нет аренд</p>
</div>

<table border="1" style="width: 100%; border-collapse: collapse;">
    <thead>
    <tr>
        <th>ID</th>
        <th>Пользователь</th>
        <th>Книга</th>
        <th>Дата аренды</th>
        <th>Дата возврата</th>
        <th>Статус</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="rental : ${rentals}">
        <td th:text="${rental.id}"></td>
        <td th:text="${rental.user.fullName}"></td>
        <td th:text="${rental.book.title}"></td>
        <td th:text="${rental.rentalDate}"></td>
        <td th:text="${rental.dueDate}"></td>
        <td th:text="${rental.status}"></td>
        <td>
            <a th:if="${rental.isActive}" th:href="@{/rentals/return/{id}(id=${rental.id})}">Вернуть</a>
        </td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/dashboard}">На главную</a></p>
</body>
</html>

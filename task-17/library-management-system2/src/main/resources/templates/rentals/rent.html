<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Аренда книги</title>
</head>
<body>
<h1>Аренда книги</h1>

<div th:if="${error}" style="color: red;" th:text="${error}"></div>

<div style="border: 1px solid #ccc; padding: 15px;">
    <h2 th:text="${book.title}"></h2>
    <p><strong>Автор:</strong> <span th:text="${book.author}"></span></p>
    <p><strong>Доступно:</strong> <span th:text="${book.availableCopies}"></span></p>
    <p><strong>Срок аренды:</strong> 14 дней</p>
</div>

<form method="post" th:action="@{/rentals/rent}" th:object="${rentalDto}">
    <input type="hidden" th:field="*{bookId}">
    <div>
        <label>Примечание:</label>
        <textarea th:field="*{notes}"></textarea>
    </div>
    <button type="submit">Подтвердить аренду</button>
    <a th:href="@{/books}">Отмена</a>
</form>
</body>
</html>

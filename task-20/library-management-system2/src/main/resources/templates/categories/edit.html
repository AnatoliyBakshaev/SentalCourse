<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать категорию</title>
</head>
<body>
<h1>Редактировать категорию</h1>

<div th:if="${error}" style="color: red;" th:text="${error}"></div>

<form method="post" th:action="@{/categories/edit/{id}(id=${category.id})}">
    <div>
        <label>Название *:</label>
        <input type="text" name="name" th:value="${category.name}" required>
    </div>
    <div>
        <label>Описание:</label>
        <textarea name="description" th:text="${category.description}"></textarea>
    </div>
    <div>
        <label>Родительская категория:</label>
        <select name="parentId">
            <option value="">-- Корневая категория --</option>
            <option th:each="cat : ${parentCategories}"
                    th:value="${cat.id}"
                    th:text="${cat.fullPath}"
                    th:selected="${cat.id == category.parent.id}"></option>
        </select>
    </div>
    <button type="submit">Сохранить</button>
    <a th:href="@{/categories}">Отмена</a>
</form>
</body>
</html>
